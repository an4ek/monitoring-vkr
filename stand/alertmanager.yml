route:
  receiver: 'webhook'
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h

receivers:
  - name: 'webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:8000/api/events/alertmanager/'
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: 'dev-webhook-token'